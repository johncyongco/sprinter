<!doctype html>
<html lang="en" class="bg-background text-primary font-sans antialiased selection:bg-accent/20">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Sprinter — a calm, collaborative writing platform where stories evolve through many minds. Someone is always waiting for your next sentence." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sprinter — Continue Someone's Thought</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("sprinter-ui") || "null");
        var theme = saved && saved.state && saved.state.theme;
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
